<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử thanh toán - Subscription Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js" defer></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7fe;
            scroll-behavior: smooth;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }

        .stagger-in {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen text-slate-800" x-data="{ 
    billingSearch: '',
    statusFilter: 'All',
    typeFilter: 'All',
    billings: [
        { no: 1, created: '10:06 16/08/2025', expired: '10:09 16/08/2027', code: 'SAI-S9VLP1IU9C', type: 'SYSTEM', total: '16.800.000đ', status: 'Paid', packageName: 'MINI CDP', period: '24 Month', modules: '52+', staff: '10', customers: '100k', automation: '5 Task' },
        { no: 2, created: '09:28 01/08/2025', expired: '09:28 01/09/2025', code: 'SAI-S9VK56Z4D4', type: 'SYSTEM', total: '7.500.000đ', status: 'Expired', packageName: 'GÓI CƠ BẢN', period: '1 Month', modules: '13+', staff: '3', customers: '10k', automation: 'Ticket' },
        { no: 3, created: '23:15 15/07/2025', expired: '23:15 15/07/2026', code: 'SAI-S9VJZ24TMP', type: 'SYSTEM', total: '90.300.000đ', status: 'Cancel', packageName: 'CDP SMAXAPP 1', period: '12 Month', modules: 'Unlimited', staff: '24/7 Support', customers: '1M', automation: 'Custom Logic' },
        { no: 4, created: '08:42 10/06/2025', expired: '08:42 10/09/2025', code: 'FREE-S54F7L03KQ', type: 'SYSTEM', total: '0đ', status: 'Paid', packageName: 'TRẢI NGHIỆM', period: '7 Days', modules: 'Full Pro', staff: 'Trial', customers: 'Basic', automation: 'No Credit Card' },
        { no: 5, created: '14:20 05/04/2025', expired: '14:20 05/05/2025', code: 'PRO-S9VM7YY2X', type: 'MANUAL', total: '2.500.000đ', status: 'Paid', packageName: 'MINI CDP', period: '1 Month', modules: '52+', staff: '10', customers: '100k', automation: '5 Task' }
    ],
    filteredBillings() {
        return this.billings.filter(b => {
            const search = (this.billingSearch || '').toLowerCase();
            const matchesSearch = b.code.toLowerCase().includes(search);
            const matchesStatus = this.statusFilter === 'All' || b.status === this.statusFilter;
            const matchesType = this.typeFilter === 'All' || b.type === this.typeFilter;
            return matchesSearch && matchesStatus && matchesType;
        });
    }
}">

    <!-- Top Navigation -->
    <nav class="bg-[#1e1e2d] text-white px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-6">
            <div class="bg-blue-600 p-2 rounded-lg">
                <i data-lucide="shield-check" class="w-5 h-5 text-white"></i>
            </div>
            <a href="subscription_center.html" class="flex items-center space-x-2 hover:opacity-80 transition-opacity">
                <span class="font-black text-lg tracking-tight">APP.VN</span>
                <span class="text-slate-500">/</span>
                <span class="text-slate-400 text-sm font-bold">Gói cước</span>
            </a>
        </div>
        <div class="flex items-center space-x-4">
            <div class="w-8 h-8 rounded-full bg-slate-600 border border-slate-700 overflow-hidden">
                <img src="https://i.pravatar.cc/100?u=antigravity" alt="Avatar">
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-8 px-6 space-y-8">

        <!-- View Toggle (My Plan / Billings) -->
        <div class="flex items-center space-x-1 bg-slate-200/50 p-1 rounded-xl w-fit stagger-in">
            <a href="subscription_center.html"
                class="text-slate-500 hover:text-slate-700 px-6 py-2 rounded-lg text-xs font-bold transition-all">Gói
                của tôi</a>
            <a href="billing_history.html"
                class="bg-[#1e1e2d] text-white shadow-sm px-6 py-2 rounded-lg text-xs font-bold transition-all">Lịch sử
                thanh toán</a>
        </div>

        <!-- BILLING HISTORY VIEW CONTENT -->
        <div class="space-y-6 stagger-in" style="animation-delay: 0.1s">
            <div class="flex items-center justify-between">
                <h2 class="text-2xl font-bold tracking-tight text-slate-800">Lịch sử thanh toán</h2>
                <div class="text-xs font-bold text-slate-400 uppercase tracking-widest"
                    x-text="`${filteredBillings().length} Hóa đơn được tìm thấy`"></div>
            </div>

            <div class="glass-card rounded-3xl overflow-hidden shadow-xl border-slate-100">
                <!-- Filter Bar -->
                <div class="p-6 border-b border-slate-50 bg-slate-50/30 flex flex-wrap items-center gap-4">
                    <div class="relative flex-grow max-w-md">
                        <i data-lucide="search"
                            class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" x-model="billingSearch" placeholder="Nhập mã đơn hàng..."
                            class="w-full pl-11 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all">
                    </div>
                    <select x-model="statusFilter"
                        class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs text-slate-600 outline-none focus:ring-2 focus:ring-blue-500/20">
                        <option value="All">Tất cả trạng thái</option>
                        <option value="Paid">Đã thanh toán (Paid)</option>
                        <option value="Expired">Hết hạn (Expired)</option>
                        <option value="Cancel">Đã hủy (Cancel)</option>
                    </select>
                    <select x-model="typeFilter"
                        class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs text-slate-600 outline-none focus:ring-2 focus:ring-blue-500/20">
                        <option value="All">Tất cả loại hình</option>
                        <option value="SYSTEM">Hệ thống (SYSTEM)</option>
                        <option value="MANUAL">Thủ công (MANUAL)</option>
                    </select>
                </div>

                <!-- Data Table -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr
                                class="bg-slate-50/50 text-[10px] uppercase font-black text-slate-400 tracking-widest border-b border-slate-100">
                                <th class="px-6 py-4">No</th>
                                <th class="px-6 py-4">Ngày tạo</th>
                                <th class="px-6 py-4">Ngày hết hạn</th>
                                <th class="px-6 py-4">Mã đơn</th>
                                <th class="px-6 py-4">Loại</th>
                                <th class="px-6 py-4 text-right">Tổng tiền</th>
                                <th class="px-6 py-4">Trạng thái</th>
                                <th class="px-6 py-4">Thông tin gói</th>
                                <th class="px-6 py-4">Hóa đơn</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50" x-init="$nextTick(() => lucide.createIcons())">
                            <template x-for="bill in filteredBillings()" :key="bill.code">
                                <tr class="hover:bg-slate-50/50 transition-colors">
                                    <td class="px-6 py-5 text-xs font-bold text-slate-400" x-text="bill.no"></td>
                                    <td class="px-6 py-5 text-xs font-medium text-slate-600" x-text="bill.created"></td>
                                    <td class="px-6 py-5 text-xs font-medium text-slate-600" x-text="bill.expired"></td>
                                    <td class="px-6 py-5 text-xs font-black text-slate-800" x-text="bill.code"></td>
                                    <td class="px-6 py-5 text-[10px] font-bold text-slate-400 uppercase"
                                        x-text="bill.type"></td>
                                    <td class="px-6 py-5 text-xs font-black text-red-500 text-right text-base"
                                        x-text="bill.total"></td>
                                    <td class="px-6 py-5">
                                        <span :class="{
                                            'bg-green-100 text-green-600': bill.status === 'Paid',
                                            'bg-slate-100 text-slate-400': bill.status === 'Expired',
                                            'bg-red-100 text-red-600': bill.status === 'Cancel'
                                        }" class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider"
                                            x-text="bill.status"></span>
                                    </td>
                                    <td class="px-6 py-5">
                                        <div class="space-y-1">
                                            <div class="flex items-center space-x-2">
                                                <p class="text-xs font-black text-blue-600 uppercase"
                                                    x-text="bill.packageName"></p>
                                                <span class="text-[10px] text-slate-400 font-bold"
                                                    x-text="`(${bill.period})`"></span>
                                            </div>
                                            <div
                                                class="grid grid-cols-4 gap-x-4 text-[9px] font-bold text-slate-400 uppercase">
                                                <div>MOD <p class="text-slate-800" x-text="bill.modules"></p>
                                                </div>
                                                <div>STAFF <p class="text-slate-800" x-text="bill.staff"></p>
                                                </div>
                                                <div>CUST <p class="text-slate-800" x-text="bill.customers"></p>
                                                </div>
                                                <div>AUTO <p class="text-slate-800" x-text="bill.automation"></p>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-5">
                                        <button
                                            class="flex items-center space-x-2 px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg font-bold text-[10px] hover:bg-slate-800 hover:text-white transition-all uppercase tracking-wider">
                                            <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                            <span>Xem</span>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- Empty State -->
                <template x-if="filteredBillings().length === 0">
                    <div class="p-20 text-center">
                        <div
                            class="bg-slate-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-slate-200">
                            <i data-lucide="file-search" class="w-8 h-8"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 uppercase text-xs tracking-widest mb-1">Không tìm thấy hóa
                            đơn</h3>
                        <p class="text-[10px] text-slate-400">Vui lòng kiểm tra lại mã đơn hàng hoặc các bộ lọc của bạn.
                        </p>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <footer
        class="bg-white border-t border-slate-100 py-12 text-center text-slate-400 text-[10px] uppercase font-bold tracking-[0.2em]">
        <p>&copy; 2026 SMAX AI Technology. Powered by Antigravity.</p>
    </footer>

    <script> lucide.createIcons(); </script>
</body>

</html>
